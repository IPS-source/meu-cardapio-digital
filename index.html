<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital | Aceguá Byte</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --azul-electrico: #007bff;
            --negro-fondo: #121212;
            --gris-card: #1e1e1e;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--negro-fondo);
            color: var(--blanco);
            margin: 0;
            padding-bottom: 90px;
        }

        header {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--azul-electrico);
        }

        .logo-text {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--azul-electrico);
            margin: 0;
        }

        .categoria-label {
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            color: var(--azul-electrico);
            background: rgba(0,123,255,0.05);
        }

        .menu-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 15px;
        }

        .producto-card {
            background: var(--gris-card);
            border-radius: 12px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .producto-img {
            width: 100px;
            height: 100px;
            background-size: cover;
            background-position: center;
        }

        .producto-info {
            padding: 12px;
            flex: 1;
        }

        .producto-titulo {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .producto-desc {
            font-size: 11px;
            color: #aaa;
            margin: 4px 0;
        }

        .producto-precio {
            color: var(--azul-electrico);
            font-weight: 600;
            font-size: 17px;
        }

        .btn-add {
            background: var(--azul-electrico);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 5px 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Carrinho Flutuante */
        .cart-float {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--azul-electrico);
            color: white;
            width: 85%;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            z-index: 1000;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <p class="logo-text">ACEGUÁ BYTE</p>
    <p style="margin:5px 0 0; font-size:12px; color: #ddd;">Cardápio Digital Inteligente</p>
</header>

<div class="categoria-label">🍔 Hamburguesas</div>

<div class="menu-container">
    <!-- Exemplo 1 -->
    <div class="producto-card">
        <div class="producto-img" style="background-image: url('https://unsplash.com');"></div>
        <div class="producto-info">
            <p class="producto-titulo">X-Salada Clásico</p>
            <p class="producto-desc">Pão, carne, queijo, alface, tomate e maionese.</p>
            <div style="display:flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                <span class="producto-precio">R$ 22,00</span>
                <button class="btn-add" onclick="agregar('X-Salada', 22)">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- Exemplo 2 -->
    <div class="producto-card">
        <div class="producto-img" style="background-image: url('https://unsplash.com');"></div>
        <div class="producto-info">
            <p class="producto-titulo">X-Bacon Especial</p>
            <p class="producto-desc">Muita carne, muito bacon e muito queijo.</p>
            <div style="display:flex; justify-content: space-between; align-items: center; margin-top: 8px;">
                <span class="producto-precio">R$ 28,00</span>
                <button class="btn-add" onclick="agregar('X-Bacon', 28)">Adicionar</button>
            </div>
        </div>
    </div>
</div>

<div class="cart-float" id="btn-carrinho" onclick="enviarPedido()">
    <span>🛒 Finalizar Pedido</span>
    <span id="total-flotante">R$ 0,00</span>
</div>

<script>
    let total = 0;
    let itensPedido = [];
    const MEU_NUMERO = "59891714945"; // Seu número configurado

    function agregar(nombre, precio) {
        total += precio;
        itensPedido.push(nombre);
        document.getElementById('total-flotante').innerText = "R$ " + total.toFixed(2).replace('.', ',');
        
        // Efeito simples de feedback
        const btn = document.getElementById('btn-carrinho');
        btn.style.transform = "translateX(-50%) scale(1.05)";
        setTimeout(() => { btn.style.transform = "translateX(-50%) scale(1)"; }, 200);
    }

    function enviarPedido() {
        if (itensPedido.length === 0) {
            alert("Seu carrinho está vazio!");
            return;
        }

        // Formata a lista de itens para o texto
        let listaTexto = "";
        itensPedido.forEach(item => {
            listaTexto += "- " + item + "\n";
        });

        // Monta a mensagem para o WhatsApp
        const mensagemFinal = "*🚀 NOVO PEDIDO - ACEGUÁ BYTE*\n\n" +
                              "*Itens:*\n" + listaTexto + "\n" +
                              "*Total: R$ " + total.toFixed(2).replace('.', ',') + "*\n\n" +
                              "Pode confirmar o pedido?";

        const textoCodificado = encodeURIComponent(mensagemFinal);
        
        // Link direto oficial sem chaves ou caracteres que causam erro de DNS
        const linkWhatsapp = "https://whatsapp.com" + MEU_NUMERO + "&text=" + textoCodificado;

        // Redireciona
        window.location.href = linkWhatsapp;
    }
</script>

</body>
</html>
