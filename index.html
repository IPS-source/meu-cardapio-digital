<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital | Aceguá Byte</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --azul: #007bff; --bg: #121212; --card: #1e1e1e; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; margin: 0; padding-bottom: 100px; }
        header { background: #000; padding: 30px; text-align: center; border-bottom: 3px solid var(--azul); }
        .logo { color: var(--azul); font-weight: 600; font-size: 24px; margin: 0; letter-spacing: 2px; }
        .categoria { padding: 20px; font-weight: 600; color: var(--azul); }
        .card { background: var(--card); margin: 0 15px 15px; border-radius: 12px; display: flex; overflow: hidden; }
        .img { width: 90px; height: 90px; background-size: cover; }
        .info { padding: 10px; flex: 1; }
        .precio { color: var(--azul); font-weight: 600; }
        .btn-add { background: var(--azul); color: white; border: none; padding: 5px 15px; border-radius: 5px; float: right; cursor: pointer; }
        
        /* O BOTÃO QUE VOCÊ VALIDOU */
        .cart-float {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--azul); color: white; width: 85%; padding: 20px;
            border-radius: 50px; display: flex; justify-content: space-between;
            font-weight: 600; box-shadow: 0 8px 20px rgba(0,123,255,0.5);
            border: none; cursor: pointer; z-index: 9999;
        }
    </style>
</head>
<body>

<header>
    <p class="logo">ACEGUÁ BYTE</p>
</header>

<div class="categoria">🍔 Hamburguesas</div>

<div id="productos">
    <div class="card">
        <div class="img" style="background-image: url('https://unsplash.com');"></div>
        <div class="info">
            <b>X-Salada</b><br><span class="precio">R$ 25,00</span>
            <button class="btn-add" onclick="add('X-Salada', 25)">+</button>
        </div>
    </div>
    <div class="card">
        <div class="img" style="background-image: url('https://unsplash.com');"></div>
        <div class="info">
            <b>X-Bacon</b><br><span class="precio">R$ 32,00</span>
            <button class="btn-add" onclick="add('X-Bacon', 32)">+</button>
        </div>
    </div>
</div>

<!-- BOTÃO FLUTUANTE REFEITO COMO LINK PURO -->
<a id="botao-final" href="#" target="_blank" class="cart-float" style="display: none; text-decoration: none;">
    <span>🛒 FINALIZAR PEDIDO</span>
    <span id="total-display">R$ 0,00</span>
</a>

<script>
    let valorTotal = 0;
    let listaItens = [];
    const WHATSAPP_NUM = "59891714945";

    function add(nome, preco) {
        valorTotal += preco;
        listaItens.push(nome);
        
        // Atualiza o preço na tela
        document.getElementById('total-display').innerText = "R$ " + valorTotal.toFixed(2).replace('.', ',');
        
        // Torna o botão visível
        const btn = document.getElementById('botao-final');
        btn.style.display = 'flex';

        // MONTA O LINK DIRETAMENTE NO "HREF" DO BOTÃO
        // Assim, quando você clica, o link já está pronto, sem depender de função
        let textoPedido = "*ACEGUÁ BYTE - NOVO PEDIDO*%0A%0A";
        listaItens.forEach(item => {
            textoPedido += "- " + item + "%0A";
        });
        textoPedido += "%0A*Total: R$ " + valorTotal.toFixed(2).replace('.', ',') + "*";

        // Aplica o link final ao botão
        btn.href = "https://whatsapp.com" + WHATSAPP_NUM + "&text=" + textoPedido;
    }
</script>

<style>
    /* Estilo garantido para o botão ser clicável */
    .cart-float {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #007bff;
        color: white;
        width: 85%;
        padding: 20px;
        border-radius: 50px;
        display: none; /* Inicia oculto e vira 'flex' no JS */
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
        box-shadow: 0 10px 25px rgba(0,123,255,0.5);
        z-index: 99999;
        -webkit-tap-highlight-color: transparent;
    }
</style>

</body>
</html>
