<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital | Aceguá Byte</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --azul-electrico: #007bff;
            --negro-fondo: #121212;
            --gris-card: #1e1e1e;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--negro-fondo);
            color: var(--blanco);
            margin: 0;
            padding-bottom: 100px;
        }

        header {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--azul-electrico);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--azul-electrico);
            margin: 0;
        }

        .categoria-label {
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            color: var(--azul-electrico);
        }

        .menu-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 0 15px;
        }

        .producto-card {
            background: var(--gris-card);
            border-radius: 12px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .producto-img {
            width: 90px;
            height: 90px;
            background-size: cover;
            background-position: center;
        }

        .producto-info {
            padding: 10px;
            flex: 1;
        }

        .producto-titulo { margin: 0; font-size: 15px; font-weight: 600; }
        .producto-precio { color: var(--azul-electrico); font-weight: 600; display: block; margin-top: 5px; }

        .btn-add {
            background: var(--azul-electrico);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 12px;
            font-weight: bold;
            cursor: pointer;
            float: right;
        }

        /* BOTÓN FLOTANTE CORREGIDO */
        .cart-float {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--azul-electrico);
            color: white;
            width: 85%;
            padding: 18px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,123,255,0.5);
            z-index: 999;
            cursor: pointer; /* Indica que es clickeable */
            border: none;
        }
    </style>
</head>
<body>

<header>
    <p class="logo-text">ACEGUÁ BYTE</p>
    <p style="margin:5px 0 0; font-size:12px; color: #ccc;">Menú Auto-Gestionado</p>
</header>

<div class="categoria-label">🍔 Hamburguesas</div>

<div class="menu-container">
    <div class="producto-card">
        <div class="producto-img" style="background-image: url('https://unsplash.com');"></div>
        <div class="producto-info">
            <p class="producto-titulo">X-Salada Especial</p>
            <span class="producto-precio">R$ 25,00</span>
            <button class="btn-add" onclick="agregar('X-Salada', 25)">Añadir +</button>
        </div>
    </div>

    <div class="producto-card" style="margin-top:10px;">
        <div class="producto-img" style="background-image: url('https://unsplash.com');"></div>
        <div class="producto-info">
            <p class="producto-titulo">X-Bacon Turbo</p>
            <span class="producto-precio">R$ 32,00</span>
            <button class="btn-add" onclick="agregar('X-Bacon', 32)">Añadir +</button>
        </div>
    </div>
</div>

<!-- EL BOTÓN AHORA TIENE ONCLICK DIRECTO -->
<div class="cart-float" id="btn-carrito" onclick="enviarPedido()">
    <span>🛒 Ver Carrito</span>
    <span id="total-flotante">R$ 0,00</span>
</div>

<script>
    let total = 0;
    let pedido = [];
    const NUMERO_WHATSAPP = "59891714945"; 

    function agregar(nombre, precio) {
        total += precio;
        pedido.push(nombre);
        document.getElementById('total-flotante').innerText = "R$ " + total.toFixed(2).replace('.', ',');
        console.log("Carrito:", pedido);
    }

    function enviarPedido() {
        console.log("Intentando enviar pedido...");
        
        if (pedido.length === 0) {
            alert("El carrito está vacío. Añade algún producto.");
            return;
        }

        let listaItens = "";
        pedido.forEach(item => {
            listaItens += "- " + item + "\n";
        });

        const mensaje = "*🚀 NUEVO PEDIDO - ACEGUÁ BYTE*\n\n" +
                        "*Productos:*\n" + listaItens + "\n" +
                        "*Total: R$ " + total.toFixed(2).replace('.', ',') + "*\n\n" +
                        "¿Podrían confirmar el pedido?";

        const mensajeEncoded = encodeURIComponent(mensaje);
        const urlFinal = "https://whatsapp.com" + NUMERO_WHATSAPP + "&text=" + mensajeEncoded;

        console.log("Redirigiendo a:", urlFinal);
        window.location.href = urlFinal;
    }
</script>

</body>
</html>
